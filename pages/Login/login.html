<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="/pages/Login/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <!-- AUTH PAGE -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <!-- Logo -->
            <div class="logo">
                <img src="/pages/Login/assets/logo-music.jpg" alt="Logo">
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
                <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Alert -->
            <div class="alert alert-error" id="alertError"></div>
            <div class="alert alert-success" id="alertSuccess"></div>

            <!-- Sign In Form -->
            <form class="form-section active" id="signinForm" onsubmit="handleSignIn(event)">
                <h1 class="form-title">Welcome back</h1>
                <p class="form-subtitle">Sign in to your account</p>

                <div class="form-group">
                    <input type="email" placeholder="Email address" id="signinEmail" required>
                </div>

                <div class="form-group password-field">
                    <input type="password" placeholder="Password" id="signinPassword" required>
                    <button type="button" class="toggle-password"
                        onclick="togglePassword('signinPassword')">👁️</button>
                </div>

                <div class="remember-forgot">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">Sign In</button>

                <p class="form-footer">
                    Don't have an account? <a onclick="switchTab('signup')">Sign up</a>
                </p>
            </form>

            <!-- Register Form -->
            <form class="form-section" id="signupForm" onsubmit="handleSignUp(event)">
                <h1 class="form-title">Create an account</h1>
                <p class="form-subtitle">Join us today</p>

                <div class="form-group">
                    <input type="text" placeholder="Full name" id="signupName" required>
                </div>

                <div class="form-group">
                    <input type="email" placeholder="Email address" id="signupEmail" required>
                </div>

                <div class="form-group password-field">
                    <input type="password" placeholder="Create password" id="signupPassword" required>
                    <button type="button" class="toggle-password"
                        onclick="togglePassword('signupPassword')">👁️</button>
                </div>

                <div class="form-group password-field">
                    <input type="password" placeholder="Confirm password" id="confirmPassword" required>
                    <button type="button" class="toggle-password"
                        onclick="togglePassword('confirmPassword')">👁️</button>
                </div>

                <button type="submit" class="btn btn-primary">Sign Up</button>

                <p class="form-footer">
                    Already have an account? <a onclick="switchTab('signin')">Sign in</a>
                </p>
            </form>

            <p class="footer-text">
                By continuing, you agree to our Terms of Service and Privacy Policy
            </p>

        </div>
    </div>



    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

        // Firebase config (My Project)
        const firebaseConfig = {
            apiKey: "AIzaSyCwOjfANyX8I29Wb1E6IpaaaNHvxzlsbZU",
            authDomain: "music-player-942f0.firebaseapp.com",
            projectId: "music-player-942f0",
            storageBucket: "music-player-942f0.firebasestorage.app",
            messagingSenderId: "221599340626",
            appId: "1:221599340626:web:a03af26a4dda5abeebe78b"
        };

        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        const alertError = document.getElementById("alertError");
        const alertSuccess = document.getElementById("alertSuccess");

        function showError(msg) {
            alertError.style.display = "block";
            alertSuccess.style.display = "none";
            alertError.innerText = msg;
        }

        function showSuccess(msg) {
            alertSuccess.style.display = "block";
            alertError.style.display = "none";
            alertSuccess.innerText = msg;
        }


        // ✅ SIGN UP
        console.log("SIGN UP CLICKED");

        window.handleSignUp = async function (e) {
            e.preventDefault();
            console.log("SIGN UP CLICKED");

            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value.trim();
            const confirm = document.getElementById("confirmPassword").value.trim();

            if (!email || !password || !confirm) {
                alert("Fill all fields");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters");
                return;
            }

            if (password !== confirm) {
                alert("Passwords do not match");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                console.log("USER CREATED:", userCredential.user.email);
                alert("Account created successfully ✅");

            } catch (error) {
                console.error("SIGN UP ERROR:", error.code, error.message);
                alert(error.message);
            } auth.onAuthStateChanged((user) => {
                if (user) {
                    window.location.href = "dashboard.html";
                }
            });

        };


        //  SIGN IN
        window.handleSignIn = async (e) => {
            e.preventDefault();

            const email = signinEmail.value.trim();
            const password = signinPassword.value.trim();

            try {
                await signInWithEmailAndPassword(auth, email, password);

                alert("Login successful");
                window.location.href = "dashboard.html";
            } catch (error) {
                console.error(error.code, error.message);
                alert(error.code);
            }
        };

        // Auth listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Logged in:", user.email);
            }
        });

    </script>


    <script src="/pages/Login/login.js"></script>

</body>

</html>
